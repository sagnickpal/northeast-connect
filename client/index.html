<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>Northeast Connect — Community Emergency Assistant | North East India</title>
    <meta name="description" content="Northeast Connect is a mobile-first, offline-resilient community emergency assistant for flood, landslide, and earthquake relief coordination across North East India." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased min-h-screen selection:bg-rose-600 selection:text-white font-scale-normal">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('PWA ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.log('ServiceWorker registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
