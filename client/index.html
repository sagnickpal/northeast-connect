<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <title>National Disaster Management Authority (NDMA) | North East Emergency Operations & Community Assistance Portal | Government of India</title>
    <meta name="description" content="Official North East Disaster Response & Emergency Assistant Portal - National Disaster Management Authority (NDMA), Ministry of Home Affairs, Government of India. Live verified flood & landslide alerts, relief shelters, highway clearance, and citizen SOS." />
    <meta name="theme-color" content="#003366" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#f0f3f8] text-slate-900 antialiased min-h-screen selection:bg-[#003366] selection:text-white font-scale-normal">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('PWA ServiceWorker registered with scope:', reg.scope);
          }).catch((err) => {
            console.log('ServiceWorker registration skipped or failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
